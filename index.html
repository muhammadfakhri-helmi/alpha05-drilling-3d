<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha-05 — Mockup urutan pemboran 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#ECEFF1; --ink-2:#AEB8C0; --ink-3:#7E8A93;
    --glass:rgba(30,33,34,.80); --line:rgba(255,255,255,.09);
    --mud:#D39A4A; --cement:#D3CCBC; --steel:#A9B4BF; --warn:#D8574A; --ok:#86B98F; --oil:#E0A93A;
    --head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
    --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0;background:#2B2A27;color:var(--ink);font-family:var(--body);overflow:hidden}
  #app{position:relative;height:100%;width:100%}
  canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  /* title */
  #title{position:absolute;left:112px;top:14px;pointer-events:none;max-width:48ch}
  #title h1{font-family:var(--head);font-weight:700;font-size:40px;line-height:1;margin:0;letter-spacing:.01em}
  #title p{margin:4px 0 0;color:var(--ink-2);font-size:14px;line-height:1.35}
  #title h1,#title p{text-shadow:0 1px 2px rgba(0,0,0,.55),0 0 14px rgba(0,0,0,.35)}
  #title .note{color:var(--ink-2);font-size:12px;margin-top:2px}

  /* depth track */
  #track{position:absolute;left:10px;top:10px;bottom:106px;width:92px;border-radius:10px;padding:8px 6px 6px;display:flex;flex-direction:column;gap:6px}
  #track .ro{font-family:var(--head);font-variant-numeric:tabular-nums;line-height:1.05}
  #track .ro b{display:block;font-size:22px;font-weight:600}
  #track .ro span{font-size:12px;color:var(--ink-3);font-family:var(--body)}
  #track canvas{flex:1;width:100%;min-height:0;border-radius:4px}

  /* panel */
  #panel{position:absolute;right:10px;top:10px;bottom:106px;width:344px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  #panel header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  #panel header h2{font-family:var(--head);font-weight:700;font-size:30px;margin:0;line-height:1}
  #panel header p{margin:4px 0 0;color:var(--ink-2);font-size:14px;min-height:1.3em}
  #pbody{overflow:auto;padding:4px 16px 16px;scrollbar-width:thin}
  .blk{padding:12px 0;border-bottom:1px solid var(--line)}
  .blk:last-child{border-bottom:0}
  .blk h3{font-family:var(--head);font-weight:600;font-size:18px;margin:0 0 6px;color:var(--ink)}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
  .kv dt{color:var(--ink-3)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .met{background:rgba(255,255,255,.04);border-radius:6px;padding:6px 8px}
  .met b{display:block;font-family:var(--head);font-weight:600;font-size:21px;font-variant-numeric:tabular-nums;line-height:1.1}
  .met span{font-size:12px;color:var(--ink-3)}
  ol.bha{margin:0;padding:0;list-style:none;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
  ol.bha li{display:flex;align-items:center;gap:8px}
  ol.bha i{width:10px;height:10px;border-radius:2px;flex:none}
  ol.bha em{margin-left:auto;font-style:normal;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .win{position:relative;height:30px;margin:6px 0 2px}
  .win .axis{position:absolute;left:0;right:0;top:9px;height:12px;border-radius:3px;background:rgba(216,87,74,.28)}
  .win .safe{position:absolute;top:9px;height:12px;background:rgba(134,185,143,.55)}
  .win .prog{position:absolute;top:12px;height:6px;border-radius:3px;background:var(--mud)}
  .win .tk{position:absolute;top:24px;font-size:11px;color:var(--ink-3);transform:translateX(-50%)}
  .sf{display:grid;grid-template-columns:64px 1fr 40px;align-items:center;gap:4px 8px;font-size:13px}
  .sf .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);position:relative;overflow:hidden}
  .sf .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--steel)}
  .sf .bar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--warn)}
  .sf span:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12.5px;padding:3px 8px;border-radius:20px;background:rgba(216,87,74,.14);color:#F0B7AE;border:1px solid rgba(216,87,74,.3)}
  .muted{color:var(--ink-3);font-size:13px;line-height:1.4;margin:6px 0 0}
  #ptog{display:none}

  /* views */
  #views{position:absolute;right:366px;top:10px;display:flex;gap:4px;padding:4px;border-radius:9px}
  #views button,#tl button,#tl select{font:500 14px var(--body);color:var(--ink);background:transparent;border:0;border-radius:6px;padding:7px 11px;cursor:pointer}
  #views button[aria-pressed="true"]{background:rgba(211,154,74,.22);color:#F4D3A3}
  button:focus-visible,select:focus-visible,#bar:focus-visible{outline:2px solid var(--mud);outline-offset:2px}

  /* timeline */
  #tl{position:absolute;left:10px;right:10px;bottom:10px;height:86px;border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;column-gap:14px;row-gap:6px;align-items:center}
  #play{width:44px;height:44px;border-radius:50% !important;background:var(--mud) !important;color:#241A0E !important;grid-row:1/3;display:grid;place-items:center;padding:0 !important}
  #play svg{width:18px;height:18px}
  #cap{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cap b{font-family:var(--head);font-weight:600;font-size:18px;margin-right:8px;color:#F4D3A3}
  #meta{display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:13px;grid-row:1/3;grid-column:3}
  #tl select{background:rgba(255,255,255,.06);padding:6px 8px}
  #bar{position:relative;height:30px;display:flex;gap:3px;cursor:pointer;grid-column:2}
  .seg{position:relative;flex:1;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
  .seg i{position:absolute;left:0;top:0;bottom:0;background:rgba(211,154,74,.55)}
  .seg span{position:absolute;left:6px;top:50%;transform:translateY(-50%);font:600 13px var(--head);color:var(--ink-2);white-space:nowrap;pointer-events:none}
  .seg.on{background:rgba(255,255,255,.13)} .seg.on span{color:var(--ink)}

  /* labels & toast */
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;font:500 12.5px var(--body);color:var(--ink);padding:2px 7px;border-radius:4px;background:rgba(24,26,27,.72);border-left:2px solid var(--mud);white-space:nowrap;transform:translate(8px,-50%)}
  .lbl.rig{border-left-color:var(--steel)}
  .lbl.l{transform:translate(calc(-100% - 8px),-50%);border-left:0;border-right:2px solid var(--steel)}
  #toast{position:absolute;left:50%;top:78px;transform:translateX(-50%);padding:9px 14px;border-radius:9px;font-size:14.5px;opacity:0;transition:opacity .35s;pointer-events:none;max-width:min(520px,70vw);text-align:center}
  #toast.show{opacity:1}
  #call{position:absolute;left:112px;top:128px;width:300px;border-radius:10px;padding:12px 14px;display:none}
  #call h4{margin:0 0 6px;font:600 18px var(--head);color:#F4D3A3}
  #call p{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink-2)}
  #call ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}

  @media (max-width: 900px){
    #title{left:84px} #title h1{font-size:30px} #title p{font-size:13px} #title .note{display:none}
    #track{width:66px;bottom:98px} #track .ro b{font-size:17px}
    #panel{top:auto;bottom:98px;left:10px;right:10px;width:auto;max-height:46vh}
    #panel.collapsed #pbody{display:none}
    #ptog{display:block;position:absolute;right:10px;top:12px;font:500 13px var(--body);color:var(--ink);background:rgba(255,255,255,.08);border:0;border-radius:6px;padding:6px 10px}
    #views{right:10px;top:auto;bottom:calc(98px + 46vh + 8px)}
    #panel.collapsed ~ #views{bottom:170px}
    #tl{height:80px;grid-template-columns:auto 1fr} #meta{display:none}
    .seg span{display:none}
    #call{left:84px;width:min(300px,60vw)}
  }
  @media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Visualisasi 3D rig dan sumur Alpha-05"></canvas>
  <div id="labels"></div>

  <div id="title">
    <h1>Alpha-05</h1>
    <p>Mockup urutan pemboran dari rig sampai komplesi, berdasarkan data rencana (plan).</p>
    <p class="note">Tidak berskala: diameter lubang dan casing diperbesar 5 kali agar terlihat.</p>
  </div>

  <aside id="track" class="glass" aria-label="Log kedalaman">
    <div class="ro"><b id="rMD">0</b><span>ft MD</span></div>
    <div class="ro"><b id="rTVD">0</b><span>ft TVD</span></div>
    <div class="ro"><b id="rInc">0.0°</b><span>inklinasi</span></div>
    <canvas id="trk"></canvas>
  </aside>

  <aside id="panel" class="glass" aria-live="polite">
    <header><h2 id="pTitle">Alpha-05</h2><p id="pSub"></p></header>
    <button id="ptog" aria-expanded="true">Sembunyikan</button>
    <div id="pbody"></div>
  </aside>

  <div id="views" class="glass" role="group" aria-label="Sudut pandang">
    <button data-v="rig">Rig</button>
    <button data-v="bit">Ikuti bit</button>
    <button data-v="well">Seluruh sumur</button>
  </div>

  <div id="toast" class="glass" role="status"></div>
  <div id="call" class="glass"></div>

  <div id="tl" class="glass">
    <button id="play" aria-label="Putar"><svg viewBox="0 0 24 24" fill="currentColor"><path id="pIco" d="M7 4l13 8-13 8z"/></svg></button>
    <div id="cap"><b id="capN">1/12</b><span id="capT"></span></div>
    <div id="meta">
      <label for="spd">Kecepatan</label>
      <select id="spd"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select>
    </div>
    <div id="bar" tabindex="0" role="slider" aria-label="Linimasa operasi" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=n=>Math.round(n).toLocaleString('en-US');
const D2R=Math.PI/180;
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= WELL DATA (plan) ================= */
const E=5;                  // radial exaggeration
const KOP=700, BUR=2, INC=29.74, AZI=222.55;
const RB=18000/(Math.PI*BUR);
const EOB=KOP+INC/BUR*100;  // 2187 ft
const TD=9604, CF=10;       // CF = cellar floor depth
const rad=inch=>inch/24*E;  // diameter in inch -> exaggerated world radius (ft)

function traj(md){
  if(md<=KOP) return {vs:0,tvd:md,inc:0};
  if(md<=EOB){const a=(md-KOP)*BUR/100*D2R;return {vs:RB*(1-Math.cos(a)),tvd:KOP+RB*Math.sin(a),inc:a};}
  const a=INC*D2R,t0=traj(EOB),L=md-EOB;return {vs:t0.vs+L*Math.sin(a),tvd:t0.tvd+L*Math.cos(a),inc:a};
}
const P=(md,v=new THREE.Vector3())=>{const t=traj(md);return v.set(t.vs,-t.tvd,0)};
const Tn=(md,v=new THREE.Vector3())=>{const a=traj(md).inc;return v.set(Math.sin(a),-Math.cos(a),0)};
const Nn=(md,v=new THREE.Vector3())=>{const a=traj(md).inc;return v.set(Math.cos(a),Math.sin(a),0)};
const vsAtTvd=tvd=>{const e=traj(EOB);if(tvd<=KOP)return 0;if(tvd<=e.tvd)return RB*(1-Math.cos(Math.asin((tvd-KOP)/RB)));return e.vs+(tvd-e.tvd)*Math.tan(INC*D2R)};

// formations (anonymised)  tvd top / md top
const FM=[
 {n:'Fm-A',tvd:0,   md:0,   c:'#B7A277',lith:'Aluvium'},
 {n:'Fm-B',tvd:630, md:630, c:'#8E9A6A',lith:'Claystone, sisipan sand'},
 {n:'Fm-C',tvd:2158,md:2229,c:'#6F8767',lith:'Claystone, sisipan limestone'},
 {n:'Fm-D',tvd:4728,md:5189,c:'#B3AE98',lith:'Limestone'},
 {n:'Fm-E',tvd:5318,md:5869,c:'#8B8774',lith:'Selang-seling claystone dan limestone'},
 {n:'Fm-F',tvd:7388,md:8253,c:'#77806F',lith:'Selang-seling claystone, limestone, siltstone'},
 {n:'Fm-G',tvd:8261,md:9258,c:'#C6BC98',lith:'Karbonat (reservoir)'}
];
const fmAtMD=md=>{let k=0;for(let i=0;i<FM.length;i++)if(md>=FM[i].md)k=i;return k};

const SEC=[
 {hole:'26"',holeIn:26,top:120,bot:2000,bit:'Milled tooth SB115C',bitType:'mt',
  mud:{type:'HPWBM inhibitif',mw:[9.8,12.0],win:[9.0,15.4],note:'Kill mud 13.0 ppg dan LCM pill 80 ppb siap di lokasi. HiVis dan HiDens sweep di TD.'},
  hyd:{gpm:1100,spp:2715,tq:3227,hl:130,hsi:0.8,liner:'7"',tfa:1.4},
  csg:{name:'20"',od:20,spec:'K-55, 133 ppf, BTC',shoe:2000,shoeTVD:1956,sf:{Burst:1.58,Collapse:1.32,Axial:3.15,Triaxial:2.53}},
  cem:'Lead 12.5 ppg + tail 15.8 ppg, excess 100%, TOC di permukaan',
  wc:{bop:'Diverter 29-1/2" x 500 psi',kt:'—',lot:'—'},
  haz:['Reactive shale','Pack off','Tight spot'],
  bha:[['Bit 26" milled tooth',26,1.5,'bit'],['Mud motor 9-5/8"',9.625,30,'motor'],['Sub 8"',8,2,'sub'],['Drill collar 8"',8,31,'dc'],['MWD 8"',8,30,'mwd'],['Drill collar 8" x2',8,62,'dc'],['Jar 8"',8,31,'jar'],['Drill collar 8"',8,31,'dc'],['Sub 8"',8,2,'sub'],['HWDP 5"',5,93,'hw']]},
 {hole:'17-1/2"',holeIn:17.5,top:2000,bot:5000,bit:'PDC TK59',bitType:'pdc',
  mud:{type:'HPWBM inhibitif',mw:[12.0,14.0],win:[11.5,15.4],note:'Fracseal 2 ppb mulai 3,500 ft. Kill mud 15.0 ppg. HiDens sweep tiap 5 stand sampai MW di atas 13 ppg.'},
  hyd:{gpm:900,spp:3244,tq:8819,hl:197,hsi:1.6,liner:'6-1/2"',tfa:1.2},
  csg:{name:'13-3/8"',od:13.375,spec:'K-55, 68 ppf, BTC',shoe:5000,shoeTVD:4564,sf:{Burst:1.75,Collapse:1.18,Axial:2.54,Triaxial:1.89}},
  cem:'Single slurry 15.8 ppg, excess 100%, TOC di permukaan',
  wc:{bop:'BOP 21-1/4" x 2,000 psi',kt:'178.87 bbl @ 10.09 ppg',lot:'15.98 ppg EMW (shoe 20")'},
  haz:['Partial loss','Tight spot','Gumbo'],
  bha:[['Bit 17-1/2" PDC',17.5,1.5,'bit'],['Mud motor 9-5/8"',9.625,30,'motor'],['Sub 8"',8,2,'sub'],['Stabilizer 17-1/2"',8,7,'stab',17.5],['Drill collar 8"',8,30,'dc'],['MWD 8"',8,30,'mwd'],['Drill collar 8" x2',8,60,'dc'],['Jar 8"',8,30,'jar'],['Drill collar 8"',8,30,'dc'],['Sub 8"',8,2,'sub'],['HWDP 5"',5,93,'hw']]},
 {hole:'12-1/4"',holeIn:12.25,top:5000,bot:9259,bit:'PDC MDi519',bitType:'pdc',
  mud:{type:'HPWBM inhibitif',mw:[14.0,15.0],win:[10.7,16.6],win2:15.1,note:'Kill mud 16.0 ppg. Fracseal 2 ppb dipertahankan. HiVis sweep tiap 5 stand.'},
  hyd:{gpm:850,spp:4488,tq:15915,hl:291,hsi:2.0,liner:'6"',tfa:1.4},
  csg:{name:'9-5/8"',od:9.625,spec:'L-80, 47 ppf, BTC',shoe:9259,shoeTVD:8261,sf:{Burst:1.81,Collapse:1.97,Axial:2.52,Triaxial:1.73}},
  cem:'Single slurry 15.8 ppg, excess 50%, TOC di permukaan',
  wc:{bop:'BOP 13-5/8" (annular + 3 ram)',kt:'51.27 bbl @ 13.9 ppg',lot:'16.2 ppg EMW (shoe 13-3/8")'},
  haz:['Tekanan formasi','Partial loss','Tight spot'],
  bha:[['Bit 12-1/4" PDC',12.25,1.3,'bit'],['Mud motor 8"',8,30,'motor'],['Sub 8"',8,2,'sub'],['Stabilizer 12-1/4"',8.25,6,'stab',12.25],['Drill collar 8"',8,30,'dc'],['MWD 8"',8,30,'mwd'],['Drill collar 8"',8,30,'dc'],['Circulating sub',8.25,3,'sub'],['Port collar / diverter sub',8,2,'sub'],['HWDP 5"',5,62,'hw'],['Jar 6-1/2"',6.5,30,'jar'],['HWDP 5"',5,62,'hw']]},
 {hole:'8-1/2"',holeIn:8.5,top:9259,bot:9604,bit:'PDC SKFX519S',bitType:'pdc',
  mud:{type:'RDIF, KCl 3%',mw:[8.7,9.0],win:[9.0,17.7],note:'Seepage di bawah 30 bph: tambah CaCO3 M 5–10 ppb. Di atas 30 bph: spot LCM pill 25–35 ppb.'},
  hyd:{gpm:600,spp:1597,tq:18664,hl:321,hsi:0.9,liner:'6"',tfa:1.4},
  csg:{name:'7" liner',od:7,spec:'L-80, 26 ppf, BTC',shoe:9604,shoeTVD:8561,tol:9108,sf:{Burst:7.24,Collapse:1.35,Axial:4.58,Triaxial:2.24}},
  cem:'Single slurry 15.8 ppg, excess 100%, TOC di top of liner',
  wc:{bop:'BOP 13-5/8" (annular + 3 ram)',kt:'168.29 bbl @ 10.18 ppg',lot:'16.55 ppg EMW (shoe 9-5/8")'},
  haz:['Partial loss','Tight spot','Logging'],
  eval:'Quad combo, resistivity, advanced cement evaluation',
  bha:[['Bit 8-1/2" PDC',8.5,1.1,'bit'],['Mud motor 6-3/4"',6.75,30,'motor'],['Sub',6.72,2,'sub'],['Stabilizer 8-1/2"',6.75,6,'stab',8.5],['Drill collar 6-3/4"',6.75,30,'dc'],['MWD 6-3/4"',6.75,30,'mwd'],['Drill collar 6-3/4"',6.75,30,'dc'],['Circulating sub',6.75,3,'sub'],['Port collar',6.75,2,'sub'],['HWDP 5"',5,62,'hw'],['Jar 6-1/2"',6.5,30,'jar'],['HWDP 5"',5,62,'hw']]}
];
const COMP={tubing:'3-1/2" L-80 EUE',esp:'ESP 160 HP',espTop:8750,espBot:8840,perfs:[[9330,9360],[9400,9430],[9470,9500],[9540,9570]]};
const BHA_COL={bit:'#C9B37A',motor:'#3F5E4C',sub:'#7F8891',stab:'#5B6B7A',dc:'#6B737B',mwd:'#C9A13D',jar:'#8A5B3D',hw:'#98A1A9'};

/* ================= PHASES ================= */
const PH=[
 {k:'intro',s:'Rig',t:'Rig 1500 HP siap di lokasi',dur:7,sec:-1,view:'rig'},
 {k:'cond',s:'30"',t:'Conductor 30" terpasang sampai 120 ft',dur:5,sec:-1,view:'rig'},
 {k:'d26',s:'26"',t:'Bor lubang 26"',dur:18,sec:0,view:'bit'},
 {k:'c20',s:'Csg 20"',t:'Run casing 20" dan cementing',dur:12,sec:0,view:'bit'},
 {k:'d17',s:'17-1/2"',t:'Bor lubang 17-1/2"',dur:18,sec:1,view:'bit'},
 {k:'c13',s:'Csg 13-3/8"',t:'Run casing 13-3/8" dan cementing',dur:12,sec:1,view:'bit'},
 {k:'d12',s:'12-1/4"',t:'Bor lubang 12-1/4"',dur:24,sec:2,view:'bit'},
 {k:'c9',s:'Csg 9-5/8"',t:'Run casing 9-5/8" dan cementing',dur:12,sec:2,view:'bit'},
 {k:'d8',s:'8-1/2"',t:'Bor lubang 8-1/2" ke reservoir',dur:13,sec:3,view:'bit'},
 {k:'log',s:'Logging',t:'Wireline logging',dur:9,sec:3,view:'bit'},
 {k:'c7',s:'Liner 7"',t:'Run liner 7" dan cementing',dur:11,sec:3,view:'bit'},
 {k:'comp',s:'Komplesi',t:'Komplesi: perforasi, tubing + ESP, X-mas tree',dur:17,sec:4,view:'bit'}
];
const PI={};PH.forEach((p,i)=>PI[p.k]=i);
const TOTAL=PH.reduce((a,p)=>a+p.dur,0);

/* ================= STATE MACHINE ================= */
function stateAt(t){
  let i=0;while(i<PH.length-1&&t>=PSTART[i+1])i++;
  const p=clamp((t-PSTART[i])/PH[i].dur);
  const k=PH[i].k, past=key=>i>PI[key];
  const S={i,p,k,hole:0,string:-1,bha:-1,drilling:false,csg:{},cem:{},bop:'none',wh:0,
           tool:-1,tubing:-1,perf:0,flow:null,focus:0,cap:'',hookMD:null};
  // hole depth baseline
  S.hole = past('d8')?9604: past('d12')?9259: past('d17')?5000: past('d26')?2000: 120;
  // casing baseline
  CSG.forEach(c=>{const dn= c.k==='c30'? i>=PI.cond : past(c.k);S.csg[c.k]=dn?1:0;S.cem[c.k]=dn?1:0;});
  if(k==='intro'){S.csg.c30=0;S.hole=0}
  S.wh = past('c9')?3: past('c13')?2: past('c20')?1:0;
  S.bop = i<=PI.cond?'none': i<=PI.c20?'div': i<=PI.c13?'b21':'b13';

  const drill=(sec,from,to,curve)=>{
    const tripEnd=0.13;
    S.bha=sec;
    if(p<tripEnd){S.string=lerp(0,from,p/tripEnd);S.hole=from;S.cap=`Trip in BHA ${SEC[sec].hole} ke ${fmt(S.string)} ft`;S.flow=null;}
    else{const q=(p-tripEnd)/(1-tripEnd);S.hole=curve?curve(q):lerp(from,to,q);S.string=S.hole;S.drilling=true;S.flow='mud';
      S.cap=`Drilling ${SEC[sec].hole} di ${fmt(S.hole)} ft MD`;}
    S.focus=S.string;S.hookMD=S.string;
  };
  const casing=(sec,ck)=>{
    const c=CSG.find(x=>x.k===ck), shoe=c.shoe;
    if(p<0.14){S.bha=sec;S.string=lerp(shoe,0,p/0.14);S.cap=`Sirkulasi, wiper trip, POOH BHA ${SEC[sec].hole}`;S.focus=Math.max(S.string,300);S.hookMD=S.string;}
    else if(p<0.58){const q=(p-0.14)/0.44;S.csg[ck]=q;S.cap=`Run casing ${SEC[sec].csg.name} ke ${fmt(lerp(CF,shoe,q))} ft`;S.focus=lerp(CF,shoe,q);S.hookMD=lerp(CF,shoe,q);}
    else if(p<0.95){const q=(p-0.58)/0.37;S.csg[ck]=1;S.cem[ck]=q;S.flow='cement';S.string=-1;
      S.cap=`Cementing casing ${SEC[sec].csg.name}: ${SEC[sec].cem.split(',')[0]}`;S.focus=lerp(shoe,Math.max(CF,shoe-2400),q);}
    else{S.csg[ck]=1;S.cem[ck]=1;S.cap=`Casing ${SEC[sec].csg.name} terpasang di ${fmt(shoe)} ft MD`;S.focus=shoe;}
  };
  switch(k){
    case 'intro': S.cap='Rig 1500 HP electric, pad dan cellar siap'; break;
    case 'cond': S.csg.c30=p;S.hole=120*p;S.cap='Pasang conductor 30" X-52 sampai 120 ft';S.focus=60;break;
    case 'd26': drill(0,120,2000); break;
    case 'c20': casing(0,'c20'); if(p>0.95){S.wh=1} break;
    case 'd17': drill(1,2000,5000); break;
    case 'c13': casing(1,'c13'); if(p>0.95){S.wh=2} break;
    case 'd12': drill(2,5000,9259,q=>q<0.8?lerp(5000,8900,q/0.8):lerp(8900,9259,(q-0.8)/0.2)); break;
    case 'c9': casing(2,'c9'); if(p>0.95){S.wh=3} break;
    case 'd8': drill(3,9259,9604); break;
    case 'log':
      if(p<0.35){S.tool=lerp(0,9590,p/0.35);S.cap='Run in wireline tool';}
      else if(p<0.85){S.tool=lerp(9590,9259,(p-0.35)/0.5);S.cap=`Logging naik: ${fmt(S.tool)} ft (quad combo, resistivity)`;}
      else{S.tool=lerp(9259,0,(p-0.85)/0.15);S.cap='POOH wireline tool';}
      S.focus=Math.max(S.tool,300);S.hookMD=null;break;
    case 'c7':{
      const tol=9108;
      if(p<0.42){S.string=lerp(0,tol,p/0.42);S.cap=`Run liner 7" dengan drill pipe: ${fmt(S.string)} ft`;S.focus=S.string;S.hookMD=S.string;S.csg.c7=p/0.42*0.15;}
      else if(p<0.6){S.string=tol;S.csg.c7=lerp(0.15,1,(p-0.42)/0.18);S.cap='Liner 7" landing, set liner hanger di 9,108 ft';S.focus=9350;}
      else if(p<0.88){S.string=tol;S.csg.c7=1;S.cem.c7=(p-0.6)/0.28;S.flow='cement';S.cap='Cementing liner 7": 15.8 ppg, TOC di top of liner';S.focus=9350;}
      else{S.csg.c7=1;S.cem.c7=1;S.string=lerp(tol,0,(p-0.88)/0.12);S.cap='POOH running string';S.focus=Math.max(S.string,300);S.hookMD=S.string;}
      break;}
    case 'comp':
      S.csg.c7=1;S.cem.c7=1;
      if(p<0.16){S.perf=p/0.16;S.cap='Perforasi TCP di liner 7" (Fm-G)';S.focus=9450;}
      else if(p<0.58){S.perf=1;S.tubing=lerp(0,COMP.espBot,(p-0.16)/0.42);S.cap=`Run ESP dan tubing 3-1/2": ${fmt(S.tubing)} ft`;S.focus=S.tubing;S.hookMD=S.tubing;}
      else if(p<0.72){S.perf=1;S.tubing=COMP.espBot;S.bop=p<0.65?'b13':'tree';S.cap=p<0.65?'Nipple down BOP 13-5/8"':'Nipple up X-mas tree';S.focus=40;S.surfaceFocus=true;}
      else{S.perf=1;S.tubing=COMP.espBot;S.bop='tree';S.flow='oil';S.cap='Uji produksi: minyak mengalir lewat ESP ke permukaan';S.focus=9000;}
      if(p>=0.65)S.bop='tree';
      break;
  }
  return S;
}

}

function makeBit(type,holeIn){
  const g=new THREE.Group(),r=rad(holeIn)*0.97;
  if(type==='mt'){
    const body=new THREE.Mesh(new THREE.CylinderGeometry(r*0.55,r*0.62,2.2,24),std('#7C8B63',{metalness:.35}));body.position.y=1.8;g.add(body);
    for(let j=0;j<3;j++){const cone=new THREE.Mesh(new THREE.ConeGeometry(r*0.42,r*0.7,14),std('#6E7F55',{metalness:.3,roughness:.55}));
      const a=j*Math.PI*2/3;cone.position.set(Math.cos(a)*r*0.45,0.45,Math.sin(a)*r*0.45);cone.rotation.z=Math.PI+Math.cos(a)*0.9;cone.rotation.x=-Math.sin(a)*0.9;g.add(cone);
      for(let q=0;q<10;q++){const tooth=new THREE.Mesh(new THREE.BoxGeometry(.28,.28,.28),std('#A7B08F'));const b=q/10*Math.PI*2;tooth.position.set(cone.position.x+Math.cos(b)*r*0.3,0.2,cone.position.z+Math.sin(b)*r*0.3);g.add(tooth);}}
  }else{
    const body=new THREE.Mesh(new THREE.CylinderGeometry(r*0.55,r*0.4,2.2,24),std('#8D9296',{metalness:.55,roughness:.35}));body.position.y=1.3;g.add(body);
    const nose=new THREE.Mesh(new THREE.SphereGeometry(r*0.45,20,10,0,Math.PI*2,Math.PI/2,Math.PI/2),std('#8D9296',{metalness:.55}));nose.position.y=0.55;g.add(nose);
    for(let j=0;j<5;j++){const bl=new THREE.Mesh(new THREE.BoxGeometry(r*0.9,1.9,r*0.16),std('#7A8085',{metalness:.5}));const a=j*Math.PI*2/5;
      bl.position.set(Math.cos(a)*r*0.5,1.0,Math.sin(a)*r*0.5);bl.rotation.y=-a;g.add(bl);
      for(let q=0;q<5;q++){const cu=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.2,10),std('#D5B45E',{metalness:.8,roughness:.25}));
        cu.position.set(Math.cos(a)*r*(0.2+q*0.19),0.15+q*0.05,Math.sin(a)*r*(0.2+q*0.19));cu.rotation.x=Math.PI/2;cu.rotation.z=a;g.add(cu);}}
  }
  return g;
}
function makeBHA(sec){

  s.bha.forEach(([name,od,len,type,blade])=>{
    if(type==='bit'){spin.add(makeBit(s.bitType,s.holeIn));y+=len*1.4;return;}
    const r=rad(od),m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,20),std(BHA_COL[type],{metalness:type==='motor'?.25:.55,roughness:.4}));
    m.position.y=y+len/2;spin.add(m);

      b.position.set(Math.cos(a)*(r+(rad(blade)-r)/2),y+len/2,Math.sin(a)*(r+(rad(blade)-r)/2));b.rotation.y=-a;b.rotation.x=0.25;spin.add(b);}}

}

const WALL={x0:-1700,x1:6300,d:9500};

function topAt(k,vs){
  if(k===0)return 0;const base=FM[k].tvd;
  const w=1-Math.exp(-Math.pow((vs-vsAtTvd(base))/900,2));
  let d=base+w*(55*Math.sin(vs/760+k*1.7)+28*Math.sin(vs/290+k*2.3));
  if(k>=4&&vs>faultX(base))d+=340+ (k-4)*40;
  return d;
}
function pattern(kind,ink){const c=document.createElement('canvas');c.width=c.height=24;const g=c.getContext('2d');g.strokeStyle=ink;g.fillStyle=ink;g.lineWidth=1.3;
  if(kind==='clay'){g.beginPath();g.moveTo(2,6);g.lineTo(10,6);g.moveTo(14,18);g.lineTo(22,18);g.stroke();}
  if(kind==='sand'){[[4,5],[15,9],[9,17],[20,20]].forEach(([x,y])=>{g.beginPath();g.arc(x,y,1.3,0,7);g.fill()})}
  if(kind==='lime'){g.strokeRect(0.5,0.5,24,12);g.beginPath();g.moveTo(12,12);g.lineTo(12,24);g.stroke();}
  if(kind==='inter'){g.beginPath();g.moveTo(2,5);g.lineTo(10,5);g.moveTo(14,5);g.lineTo(22,5);g.moveTo(0,12.5);g.lineTo(24,12.5);g.moveTo(12,12.5);g.lineTo(12,24);g.stroke();}
  return c;}
function buildWall(){

  const kinds=['A','B','C','D','E','F','G'];
  const pf=kinds.map(k=>g.createPattern(pats[k],'repeat'));
  for(let px=0;px<cw;px+=2){const vs=WALL.x0+px/cw*(WALL.x1-WALL.x0);
    for(let k=0;k<FM.length;k++){const d0=topAt(k,vs),d1=k<FM.length-1?topAt(k+1,vs):WALL.d;const y0=Y(d0),h=Y(d1)-y0+1;

  for(let k=0;k<FM.length;k++){const vs=-900,d0=topAt(k,vs),d1=k<FM.length-1?topAt(k+1,vs):WALL.d;const y=Y((d0+d1)/2)+14;
    g.fillStyle='rgba(20,18,14,.55)';g.fillText(FM[k].n,X(vs)+2,y+2);g.fillStyle='#F1EEE6';g.fillText(FM[k].n,X(vs),y);}
  g.fillStyle='rgba(18,16,14,.18)';g.fillRect(0,0,cw,ch);

  BHA.forEach(b=>b.visible=false);

  if(S.string>=0){
    let bLen=0;
    if(S.bha>=0&&PH[S.i].k!=='c7'){const b=BHA[S.bha];b.visible=true;bLen=b.userData.len;const md=Math.max(S.string,2);
      P(md,b.position);Tn(md,_t);b.quaternion.setFromUnitVectors(UP,_t.clone().negate());
      if(S.drilling)b.children[0].rotation.y+=dt*(S.bha===0?10:14);}
    reveal(dpMesh,(S.string-bLen-CF)/(TD-CF));

function updateParticles(S,dt){

  updateLabels(S);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function init(){
  buildWall();buildSurface();buildStacks();initLabels();resize();
  const v=viewTarget(stateAt(0));camera.position.copy(v.pos);controls.target.copy(v.tgt);setView('rig',true);syncPlay();
  const q=new URLSearchParams(location.search);if(q.has('t')){T=+q.get('t');}if(q.has('v'))setView(q.get('v'),true);if(q.has('pause')){playing=false;syncPlay();}
  requestAnimationFrame(t=>{last=t;frame(t)});
}
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(init);
})();
</script>
